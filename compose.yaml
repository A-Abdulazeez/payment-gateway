services:
  postgres:
    image: postgres:17-alpine
    container_name: ficmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ficmart_payment
      POSTGRES_USER: ficmart
      POSTGRES_PASSWORD: ficmart_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: